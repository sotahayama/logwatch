[project]
name = "logwatch-detector"
version = "0.1.0"
description = "PCA-based anomaly detection for logwatch minute counts"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "scikit-learn>=1.5",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["logwatch_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
